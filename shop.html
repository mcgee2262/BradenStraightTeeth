<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Shark Teeth · Braden Tooth &amp; Tide</title>
  <meta name="description" content="Shop megalodon, great white, mako, tiger and sand tiger shark teeth. (Demo site)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <section class="hero page-hero">
    <div class="wrap" style="grid-template-columns:1fr;text-align:center">
      <div>
        <p class="eyebrow">The Shop</p>
        <h1>Every Tooth in the Case</h1>
        <p class="lead" style="margin:16px auto 0">From $2 sand tigers to a museum-grade megalodon. Filter by species, grade or price to find your next tooth.</p>
      </div>
    </div>
    <div class="waves" aria-hidden="true">
      <svg viewBox="0 0 1600 120" preserveAspectRatio="none"><path d="M0 50 Q100 15 200 50 T400 50 T600 50 T800 50 T1000 50 T1200 50 T1400 50 T1600 50 V120 H0Z" fill="#3a8fa6"/></svg>
      <svg viewBox="0 0 1600 120" preserveAspectRatio="none"><path d="M0 70 Q100 40 200 70 T400 70 T600 70 T800 70 T1000 70 T1200 70 T1400 70 T1600 70 V120 H0Z" fill="#12627f"/></svg>
    </div>
  </section>

  <section class="band mid flat" style="padding-top:30px;background:linear-gradient(180deg,var(--mid),var(--deep) 60%,var(--abyss))">
    <div class="bubbles" data-count="16"></div>
    <div class="wrap shop-layout">
      <aside class="filters">
        <h3>Search</h3>
        <input type="search" id="search" placeholder="Meg, Oak Island, serrated…">
        <h3>Species</h3>
        <div class="chips" id="species-chips"></div>
        <h3>Grade</h3>
        <select id="grade">
          <option value="all">All grades</option>
          <option>Beach</option><option>Collector</option><option>Museum</option><option>Gift</option>
        </select>
        <h3>Max price</h3>
        <input type="range" id="max" min="5" max="1200" step="5" value="1200">
        <div class="range-row"><span>$5</span><span id="max-label">$1,200</span></div>
        <p style="margin-top:16px"><button class="link-btn" data-reset>Reset filters</button></p>
      </aside>
      <div>
        <div class="shop-top">
          <p id="count"></p>
          <select id="sort" aria-label="Sort">
            <option value="featured">Sort: Braden’s Picks first</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="size">Size: biggest first</option>
          </select>
        </div>
        <div class="grid" id="products"></div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/teeth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
