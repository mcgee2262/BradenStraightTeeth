<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart · Braden’s Straight Teeth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <section class="band deep flat" style="padding-top:50px;min-height:70vh;background:linear-gradient(180deg,var(--mid),var(--deep))">
    <div class="bubbles" data-count="12"></div>
    <div class="wrap">
      <h1 style="color:#fff;margin-bottom:28px">Your Cart</h1>
      <div id="cart"></div>
    </div>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div style="font-size:3rem">🦈</div>
      <h2 id="modal-title">Thanks for shopping!</h2>
      <p>This is a <b>demo store</b>, so no order was placed and no payment was taken. If Braden’s Straight Teeth were real, your teeth would be on their way.</p>
      <button class="btn btn-coral" id="clear-cart" data-close>Empty cart</button>
      <button class="btn btn-ghost" data-close>Keep browsing</button>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/teeth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
